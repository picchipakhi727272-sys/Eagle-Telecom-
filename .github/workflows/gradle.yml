name: Build Eagle Telecom APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.2.1"

      - name: Extract fixed Android project
        run: |
          rm -rf build-project
          unzip -q Eagle-Telecom-fixed.zip -d build-project

      - name: Build APK
        working-directory: build-project/Eagle-Telecom
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eagle-Telecom-debug-apk
          path: build-project/**/app/build/outputs/apk/debug/*.apk
